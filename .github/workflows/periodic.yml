name: Periodic Health Check

on: 
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

jobs:
  health_check:
    runs-on: ubuntu-latest
    steps: 
      - name: URL Health Check
        uses: Jtalk/url-health-check-action@v4
        with:
          url: https://pokeapi.co/api/v2/pokemon/?limit=50
          max-attempts: 3
          retry-delay: 5s
      