name: Deployment pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches: [main]
    types: [opened, synchronize]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4 # can call previously made public actions
      - uses: actions/setup-node@v4
        # allows the action to have a parameter, in this case adds the parameter to include the node-version to be 20
        with:
          node-version: '20'
      - name: Install dependencies
        # after installing node, we can install the dependencies needed for the application
        run: npm install
      - name: lint
        # after installing all the dependencies, we can run specific commands for our workflow, in this case checking code style
        run: npm run eslint
      - name: build
        run: npm run build
      - name: test
        run: npm run test
      - name: install playwright
        run: npx playwright install
      - name: e2e tests
        run: npm run test:e2e


  main: 
    name: Deploy to Render
    needs: [build_and_test]
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')}}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Deployment
        uses: sws2apps/render-deployment@main
        with: 
          serviceId: ${{ secrets.RENDER_SERVICE_ID }}
          apiKey: ${{ secrets.RENDER_API_KEY }}
      

  tag_release: 
    needs: [main]
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message, '#skip')}}
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
        with:
          fetch-depth: '0'
      - name: Bump version and push tag
        uses: anothrNick/github-tag-action@4ed44965e0db8dab2b466a16da04aec3cc312fd8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
  
  notify:
    needs: [build_and_test, main]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Discord Webhook Notify Success
        uses: sarisia/actions-status-discord@v1
        if: ${{needs.build_and_test.result == 'success' && needs.main.result == 'success'}}
        with: 
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          nodetail: true
          title: Build deployed
          description: "`Pokedex` application deployed successfully"
      - name: Discord Webhook Notify Failure
        uses: sarisia/actions-status-discord@v1
        if: ${{needs.build_and_test.result == 'failure' || needs.main.result == 'failure'}}
        with: 
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          title: Build failed